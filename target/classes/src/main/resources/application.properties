spring.application.name=cassette-backend

# Do not expose internal exception details to API clients
server.error.include-message=never

# Database
spring.datasource.url=jdbc:h2:file:./data/cassettedb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable development database console by default
spring.h2.console.enabled=false

# OpenAI API key supplied dynamically at runtime
openai.api.key=${OPENAI_API_KEY:}